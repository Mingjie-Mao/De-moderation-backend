spring:
  application:
    name: campusguard-backend

  ai:
    model:
      # Off unless explicitly switched on. Spring AI's Gemini autoconfiguration
      # activates by default once the dependency is present and then fails to
      # build its client without credentials, so merely adding the library turns
      # a missing key from a degradation into a total outage. That is the exact
      # opposite of what this integration is supposed to demonstrate.
      chat: ${AI_CHAT_MODEL:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            # An alias rather than a pinned version. A pinned one was the first
            # thing to break on real contact: gemini-2.5-flash answered 404 with
            # "no longer available to new users", which is a failure mode a
            # version number invites and an alias does not.
            #
            # Recorded against every invocation regardless, so cost stays
            # attributable across a model change.
            model: ${GEMINI_MODEL:gemini-flash-latest}
            temperature: 0.0

  data:
    web:
      pageable:
        # Spring's own ceiling is 2000, which lets any caller ask for the whole
        # forum in one request and turns a feed read into a scan.
        max-page-size: 100

  web:
    # Validation messages come from Hibernate Validator's bundled translations,
    # which otherwise resolve against the server's machine locale: the same
    # request would return English on one host and Chinese on another. Pinning
    # the fallback makes the response depend on the request instead of on the
    # deployment. The resolver stays the default accept-header one, so a client
    # that asks for another language still gets it.
    locale: en

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusguard}
    username: ${DB_USER:campusguard}
    password: ${DB_PASSWORD:campusguard}

  jpa:
    # validate, not update: the schema is owned by Flyway. If an entity and a
    # migration disagree, the app must fail at startup rather than silently
    # mutating the database.
    hibernate:
      ddl-auto: validate
    # Off by default here: keeping a session open through view rendering hides
    # lazy-loading problems and holds connections longer than necessary.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints are grouped by tag rather than listed in discovery order, so the
    # UI reads as a moderation console instead of a flat dump.
    tags-sorter: alpha
    operations-sorter: method

campusguard:
  evaluation:
    # Two hundred samples back to back is a burst no real traffic produces, and
    # it is the one workload that reliably trips a provider's per-minute ceiling.
    # 5s paces a run to 12 requests a minute; raise the interval if the account's
    # limit is lower, lower it if higher.
    min-call-interval: ${EVAL_CALL_INTERVAL:5s}

  reports:
    # Every distinct target reported becomes a case, and every case is an engine
    # call. One account working through a hundred posts files a hundred
    # individually legitimate reports, and nothing else in the workflow stops it:
    # the per-target uniqueness only prevents reporting the same thing twice.
    per-user-limit: 20
    per-user-window: 1h

  security:
    jwt:
      # No default. A fallback signing key is the kind of thing that reaches
      # production unnoticed, and a token signed with a publicly known key is not
      # authentication at all, so startup fails when this is unset.
      secret: ${JWT_SECRET}
      # Short, because nothing revokes a token that has already been issued: a
      # ban or a demotion only takes full effect once the outstanding token
      # expires.
      ttl: 1h

  moderation:
    # Which registered engine judges live traffic. Swapping implementations is a
    # configuration change rather than a code change.
    engine: ${MODERATION_ENGINE:keyword-v1}
    # What the queue degrades to. Never a model: an outage must not take the
    # primary path and its fallback down together.
    fallback-engine: keyword-v1
    batch-size: 20
    poll-interval: 2s
    # A case held longer than this is assumed to belong to a worker that died,
    # and goes back on the queue.
    stalled-after: 5m
    scheduler-enabled: true

    ai:
      # One call's budget. A slow queue recovers; a queue whose threads are all
      # parked on calls that will never answer does not.
      #
      # Was 10s, chosen before anything had been measured. On the first real run
      # that cut off 14 of 24 calls, while the ones that did land had a median of
      # 2.3s and a 95th percentile of 4.2s — a long tail rather than a broken
      # provider. 30s keeps the tail and still bounds the damage, and the circuit
      # breaker is what handles an outage.
      call-timeout: 30s
      # Once half of the recent calls have failed, stop sending them. Without
      # this, an outage costs the full timeout on every single case.
      failure-rate-threshold: 50
      open-duration: 30s
      sliding-window-size: 10
      # Two attempts means one corrective retry. A model that produced nonsense
      # twice with the mistake spelled out will not produce sense on the third
      # try, and every attempt is billed.
      max-attempts: 2
      # Separate from max-attempts: that is for the model getting the answer's
      # shape wrong, this is for the provider declining to answer yet. Being
      # throttled is the one failure that waiting actually fixes, and a free-tier
      # key running a two-hundred sample benchmark will meet it constantly.
      rate-limit-retries: 4
      rate-limit-backoff: 2s
      # One engine per entry. Listing several is how "which model" becomes a
      # measurement on the evaluation set rather than a reading of a spec sheet.
      # The first is what live traffic uses.
      models: ${GEMINI_MODELS:gemini-flash-latest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    com.campusguard: debug
