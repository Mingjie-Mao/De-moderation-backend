spring:
  application:
    name: campusguard-backend

  ai:
    model:
      # Off unless explicitly switched on. Spring AI's Gemini autoconfiguration
      # activates by default once the dependency is present and then fails to
      # build its client without credentials, so merely adding the library turns
      # a missing key from a degradation into a total outage. That is the exact
      # opposite of what this integration is supposed to demonstrate.
      chat: ${AI_CHAT_MODEL:none}
    google:
      genai:
        api-key: ${GEMINI_API_KEY:}
        chat:
          options:
            # An alias rather than a pinned version. A pinned one was the first
            # thing to break on real contact: gemini-2.5-flash answered 404 with
            # "no longer available to new users", which is a failure mode a
            # version number invites and an alias does not.
            #
            # Recorded against every invocation regardless, so cost stays
            # attributable across a model change.
            model: ${GEMINI_MODEL:gemini-flash-latest}
            temperature: 0.0

  data:
    web:
      pageable:
        # Spring's own ceiling is 2000, which lets any caller ask for the whole
        # forum in one request and turns a feed read into a scan.
        max-page-size: 100

  web:
    # Validation messages come from Hibernate Validator's bundled translations,
    # which otherwise resolve against the server's machine locale: the same
    # request would return English on one host and Chinese on another. Pinning
    # the fallback makes the response depend on the request instead of on the
    # deployment. The resolver stays the default accept-header one, so a client
    # that asks for another language still gets it.
    locale: en

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:campusguard}
    username: ${DB_USER:campusguard}
    password: ${DB_PASSWORD:campusguard}

  jpa:
    # validate, not update: the schema is owned by Flyway. If an entity and a
    # migration disagree, the app must fail at startup rather than silently
    # mutating the database.
    hibernate:
      ddl-auto: validate
    # Off by default here: keeping a session open through view rendering hides
    # lazy-loading problems and holds connections longer than necessary.
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 9MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints are grouped by tag rather than listed in discovery order, so the
    # UI reads as a moderation console instead of a flat dump.
    tags-sorter: alpha
    operations-sorter: method

campusguard:
  evaluation:
    # Two hundred samples back to back is a burst no real traffic produces, and
    # it is the one workload that reliably trips a provider's per-minute ceiling.
    # 5s paces a run to 12 requests a minute; raise the interval if the account's
    # limit is lower, lower it if higher.
    min-call-interval: ${EVAL_CALL_INTERVAL:5s}
    # One measurement by default. Above one, every metric is reported as a mean
    # with the observed range beside it, and the range is what stops a two-point
    # gap being read as a result: v1 measured 0.636 and then 0.617 with nothing
    # changed between the runs. Three runs cost three times the model calls.
    runs: ${EVAL_RUNS:1}

  content:
    # A ceiling on flooding, not a throttle on enthusiasm: a person arguing at
    # midnight should never meet these, a script should meet them at once.
    # Registration is open, so being signed in was never a brake on anything.
    posts-per-user: 30
    comments-per-user: 120
    window: 1h

  reports:
    # Every distinct target reported becomes a case, and every case is an engine
    # call. One account working through a hundred posts files a hundred
    # individually legitimate reports, and nothing else in the workflow stops it:
    # the per-target uniqueness only prevents reporting the same thing twice.
    per-user-limit: 20
    per-user-window: 1h

  admin:
    # The first administrator. Registration only ever produces a MEMBER, so
    # without this a fresh database has a moderation console nobody can open.
    #
    # Read only when the account does not yet exist: an existing user with this
    # name is never promoted and never has its password rewritten. Otherwise
    # naming somebody who already registered would hand them the console, and
    # editing the password here would rotate a live credential silently.
    username: ${ADMIN_USERNAME:}
    password: ${ADMIN_PASSWORD:}

  security:
    # Whether the OpenAPI document and Swagger UI are readable without a
    # credential. True suits local API exploration; a browser fetches the spec
    # with no Authorization header, so protecting it leaves Swagger blank. The
    # production profile disables it because reviewers use admin-web.
    expose-api-docs: ${EXPOSE_API_DOCS:true}
    expose-prometheus: ${EXPOSE_PROMETHEUS:false}
    jwt:
      # No default. A fallback signing key is the kind of thing that reaches
      # production unnoticed, and a token signed with a publicly known key is not
      # authentication at all, so startup fails when this is unset.
      secret: ${JWT_SECRET}
      # A ban or a demotion no longer waits for this: every authenticated request
      # re-reads the account. What the ttl still bounds is a token stolen from a
      # member in good standing, which nothing server-side can distinguish from
      # the member using it.
      ttl: 1h
    refresh-token-ttl: 30d
    password-reset-ttl: 30m

  public-url: ${PUBLIC_URL:http://localhost:3000}
  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:no-reply@campusguard.local}

  cors:
    # Comma-separated in production, for example
    # https://admin.example.edu,https://app.example.edu. Bearer tokens are used,
    # so browser credentials/cookies are deliberately not enabled.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  media:
    # FILESYSTEM or S3. The filesystem is the default so the project starts with
    # no cloud account, and it is the wrong answer anywhere the container's disk
    # is rebuilt on release: there it loses every uploaded image on every deploy,
    # silently, while the database keeps every row describing them.
    backend: ${MEDIA_BACKEND:FILESYSTEM}
    storage-path: ${MEDIA_STORAGE_PATH:${java.io.tmpdir}/campusguard-media}
    max-upload-size: 8MB
    max-pixels: 20000000

    # Any bucket speaking the S3 API: AWS S3, Cloudflare R2, or GCS in its
    # interoperability mode. One implementation covers all three; which one is
    # live is the endpoint below.
    s3:
      bucket: ${MEDIA_S3_BUCKET:}
      # R2 wants "auto"; AWS wants a real region.
      region: ${MEDIA_S3_REGION:auto}
      # Empty for AWS itself. R2: https://<account>.r2.cloudflarestorage.com
      endpoint: ${MEDIA_S3_ENDPOINT:}
      access-key: ${MEDIA_S3_ACCESS_KEY:}
      secret-key: ${MEDIA_S3_SECRET_KEY:}
      # Required by MinIO and by most S3-compatible servers that are not AWS.
      path-style: ${MEDIA_S3_PATH_STYLE:true}
      # A folder inside the bucket. Worth keeping even on a dedicated bucket:
      # the sweep below deletes stored objects it can find no row for, and this
      # prefix is the boundary of what it can reach.
      prefix: ${MEDIA_S3_PREFIX:media/}

    # Deletes media nothing refers to. Off by default because it deletes.
    sweep:
      enabled: ${MEDIA_SWEEP_ENABLED:false}
      # The only thing between the sweep and an upload still in flight: between
      # writing the bytes and committing the row a stored object legitimately has
      # no row, and that window must be far shorter than this.
      grace: 24h
      batch-size: 200
      interval: 1h

  auth-rate-limit:
    registrations-per-ip: 10
    logins-per-ip: 30
    logins-per-account: 12
    refreshes-per-ip: 60
    window: 15m

  moderation:
    # Which registered engine judges live traffic. Swapping implementations is a
    # configuration change rather than a code change.
    engine: ${MODERATION_ENGINE:keyword-v1}
    # What the queue degrades to. Never a model: an outage must not take the
    # primary path and its fallback down together.
    fallback-engine: keyword-v1
    batch-size: 20
    poll-interval: 2s
    # A case held longer than this is assumed to belong to a worker that died,
    # and goes back on the queue.
    stalled-after: 5m
    scheduler-enabled: true

    ai:
      # One call's budget. A slow queue recovers; a queue whose threads are all
      # parked on calls that will never answer does not.
      #
      # Was 10s, chosen before anything had been measured. On the first real run
      # that cut off 14 of 24 calls, while the ones that did land had a median of
      # 2.3s and a 95th percentile of 4.2s — a long tail rather than a broken
      # provider. 30s keeps the tail and still bounds the damage, and the circuit
      # breaker is what handles an outage.
      call-timeout: 30s
      # Once half of the recent calls have failed, stop sending them. Without
      # this, an outage costs the full timeout on every single case.
      failure-rate-threshold: 50
      open-duration: 30s
      sliding-window-size: 10
      # Two attempts means one corrective retry. A model that produced nonsense
      # twice with the mistake spelled out will not produce sense on the third
      # try, and every attempt is billed.
      max-attempts: 2
      # Separate from max-attempts: that is for the model getting the answer's
      # shape wrong, this is for the provider declining to answer yet. Being
      # throttled is the one failure that waiting actually fixes, and a free-tier
      # key running a two-hundred sample benchmark will meet it constantly.
      rate-limit-retries: 4
      rate-limit-backoff: 2s
      # One engine per entry. Listing several is how "which model" becomes a
      # measurement on the evaluation set rather than a reading of a spec sheet.
      # The first is what live traffic uses.
      models: ${GEMINI_MODELS:gemini-flash-latest}

    investigator:
      # Off by default, like the model engine. One investigation is several model
      # calls where a verdict is one, so it is turned on deliberately and it is
      # reached by a reviewer clicking rather than by the queue.
      enabled: ${INVESTIGATOR_ENABLED:false}
      # A budget, not a target. A model still gathering evidence on the sixth
      # lookup is not converging, and the seventh will not change that.
      max-steps: 5
      # One corrective retry, counted separately from the lookups: a rejected
      # brief is the model getting the answer's shape wrong, not evidence it
      # still needs. The same split AiProperties makes between max-attempts and
      # rate-limit-retries.
      max-corrections: 1
      # inv-v4, and inv-v5 is registered but not chosen.
      #
      # v2 taught the model what the four outcomes do, which is what let it reach
      # NONE; v3 replaced the confidence number with a band, because seven briefs
      # out of nine across v1 and v2 came back at exactly 0.85; v4 fetches the
      # author's record and the precedent before the first turn, which halved the
      # tokens and took the average from 2.7 lookups to 1.
      #
      # v5 tells the model how to read the dismissal rate the precedent tool now
      # returns. It was aimed at one repeatable failure — ordinary student
      # content recommended for takedown three times out of three — and on the
      # investigation set it did not move that scenario at all. Elsewhere it was
      # a wash: agreement and stability identical, grounding a little better,
      # exact match a little worse, all within one scenario of v4 on a set of
      # sixteen. Not switched to, because a change that did not do what it was
      # for should not be adopted on the strength of noise elsewhere.
      prompt-version: inv-v4

      # One opinion per click.
      #
      # Above one, EvidenceStrength stops being the model's grade of its own
      # certainty and becomes a count of how often repeated runs agreed, which is
      # the honest version of that field. It is left at one because the effect
      # has not been measured: the run that would have measured it exhausted the
      # provider's quota, and three investigations per click is not a default to
      # adopt on a plausible story. The set puts single-run stability at 0.938,
      # so the ceiling is small.
      runs: ${INVESTIGATOR_RUNS:1}

      # The only click in this system that spends money directly. A report costs
      # a queue slot and a decision costs nothing; this calls a model, several
      # times over with runs above one. Generous enough that a reviewer working
      # a queue never meets it, low enough that a stuck mouse button cannot run
      # up a bill overnight.
      per-reviewer-per-hour: 60

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # Unauthenticated callers get the overall status and nothing else, which
      # is all a load balancer reads. With details on, this endpoint answers an
      # anonymous GET with the deployment's absolute filesystem path, its disk
      # capacity and the database engine — a free map of the host for anyone who
      # asks. Signed-in administrators still see the full component breakdown.
      show-details: when-authorized
      roles: ADMIN
      probes:
        enabled: true

logging:
  level:
    com.campusguard: debug
