global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files: [/etc/prometheus/alerts.yml]

# Without this block Prometheus evaluates every rule in alerts.yml, shows them
# firing on its own status page, and tells nobody.
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: campusguard-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:9090"]
