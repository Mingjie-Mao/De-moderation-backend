apiVersion: v1
kind: Namespace
metadata: { name: campusguard }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: campusguard-media, namespace: campusguard }
spec:
  # Multiple backend replicas need a shared RWX volume. Use object storage and a
  # corresponding MediaService adapter if the cluster has no RWX storage class.
  accessModes: [ReadWriteMany]
  resources: { requests: { storage: 20Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: campusguard }
spec:
  replicas: 2
  selector: { matchLabels: { app: campusguard-backend } }
  template:
    metadata: { labels: { app: campusguard-backend } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001 }
      containers:
        - name: backend
          image: registry.example.edu/campusguard/backend:replace-with-release
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9090 }
          env:
            - { name: SPRING_PROFILES_ACTIVE, value: prod }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: campusguard }
            - { name: DB_USER, value: campusguard }
            - { name: PUBLIC_URL, value: "https://moderation.example.edu" }
            - { name: CORS_ALLOWED_ORIGINS, value: "https://moderation.example.edu" }
            - { name: MEDIA_STORAGE_PATH, value: /data/media }
            - { name: MAIL_ENABLED, value: "false" }
          envFrom: [{ secretRef: { name: campusguard-secrets } }]
          volumeMounts: [{ name: media, mountPath: /data/media }]
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "2", memory: 1536Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 45
            periodSeconds: 20
      volumes: [{ name: media, persistentVolumeClaim: { claimName: campusguard-media } }]
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: campusguard }
spec:
  selector: { app: campusguard-backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: management, port: 9090, targetPort: management }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: admin-web, namespace: campusguard }
spec:
  replicas: 2
  selector: { matchLabels: { app: campusguard-admin } }
  template:
    metadata: { labels: { app: campusguard-admin } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: admin-web
          image: registry.example.edu/campusguard/admin-web:replace-with-release
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe: { httpGet: { path: /, port: http }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: admin-web, namespace: campusguard }
spec:
  selector: { app: campusguard-admin }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: campusguard
  namespace: campusguard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
spec:
  ingressClassName: nginx
  tls:
    - hosts: [moderation.example.edu, api.moderation.example.edu]
      secretName: campusguard-tls
  rules:
    - host: moderation.example.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: admin-web, port: { name: http } } }
    - host: api.moderation.example.edu
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend, namespace: campusguard }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: backend, namespace: campusguard }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: campusguard-backend } }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: protect-management-port, namespace: campusguard }
spec:
  podSelector: { matchLabels: { app: campusguard-backend } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {}
      ports: [{ protocol: TCP, port: 8080 }]
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: monitoring } }
      ports: [{ protocol: TCP, port: 9090 }]
