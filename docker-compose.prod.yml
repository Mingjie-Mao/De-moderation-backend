name: campusguard

services:
  postgres:
    image: postgres:16.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campusguard}
      POSTGRES_USER: ${DB_USER:-campusguard}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: postgres
      DB_NAME: ${DB_NAME:-campusguard}
      DB_USER: ${DB_USER:-campusguard}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      PUBLIC_URL: https://${DOMAIN:?DOMAIN is required}
      CORS_ALLOWED_ORIGINS: https://${DOMAIN}
      # FILESYSTEM writes to the media-data volume below, which does survive a
      # rebuild here. Set MEDIA_BACKEND=S3 on any platform where that is not
      # true — the startup log says which one is live.
      MEDIA_BACKEND: ${MEDIA_BACKEND:-FILESYSTEM}
      MEDIA_STORAGE_PATH: /data/media
      MEDIA_S3_BUCKET: ${MEDIA_S3_BUCKET:-}
      MEDIA_S3_REGION: ${MEDIA_S3_REGION:-auto}
      MEDIA_S3_ENDPOINT: ${MEDIA_S3_ENDPOINT:-}
      MEDIA_S3_ACCESS_KEY: ${MEDIA_S3_ACCESS_KEY:-}
      MEDIA_S3_SECRET_KEY: ${MEDIA_S3_SECRET_KEY:-}
      MEDIA_S3_PATH_STYLE: ${MEDIA_S3_PATH_STYLE:-true}
      MEDIA_S3_PREFIX: ${MEDIA_S3_PREFIX:-media/}
      MEDIA_SWEEP_ENABLED: ${MEDIA_SWEEP_ENABLED:-true}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-none}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODELS: ${GEMINI_MODELS:-gemini-flash-latest}
      MODERATION_ENGINE: ${MODERATION_ENGINE:-keyword-v1}
    volumes:
      - media-data:/data/media
    networks: [edge, data, observability]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  admin-web:
    build:
      context: ./admin-web
      args:
        NEXT_PUBLIC_API_BASE_URL: https://api.${DOMAIN:?DOMAIN is required}
    restart: unless-stopped
    networks: [edge]
    depends_on:
      backend: { condition: service_healthy }

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [edge]
    depends_on: [admin-web, backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    networks: [observability]
    depends_on: [alertmanager]

  # The half of alerting that was missing: alerts.yml was being evaluated by
  # Prometheus and delivered to nobody.
  alertmanager:
    image: prom/alertmanager:v0.28.1
    restart: unless-stopped
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      # Rendered by scripts/render-alertmanager.sh before a release, because
      # Alertmanager does not expand environment variables in its own config.
      #
      # Long syntax, so that a config nobody rendered stops the deploy. The short
      # form creates whatever is missing at the source path as an empty
      # directory: the container then starts against a directory, restarts
      # forever, and leaves that directory where the render script later tries to
      # write the file. Silent alerting is worse than a failed deploy.
      - type: bind
        source: ./deploy/observability/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
        bind:
          create_host_path: false
      - alertmanager-data:/alertmanager
    networks: [observability]

  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    networks: [observability]

networks:
  edge: {}
  data: { internal: true }
  observability: { internal: true }

volumes:
  postgres-data: {}
  media-data: {}
  caddy-data: {}
  caddy-config: {}
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
