name: CI

on:
  push:
  pull_request:

# The default token is broader than either job needs. Neither writes anything
# back to the repository, so read access to the contents is the whole
# requirement, and a workflow that cannot write cannot be turned into one that
# does by an action it depends on.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: '21', cache: maven }
      # The suite starts PostgreSQL and MinIO through Testcontainers, so the
      # runner's Docker daemon is a dependency of `verify` rather than of the
      # image build below.
      - run: mvn --batch-mode verify
      - run: docker build -t campusguard-backend:ci .

  admin-web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: admin-web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: '22', cache: npm, cache-dependency-path: admin-web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
